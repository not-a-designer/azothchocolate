<section class="experiences" id="experiences">
  <div class="container">
    <header class="section-intro">
      <p class="eyebrow">Choose the format</p>
      <h2 class="section-heading">Four ways to explore chocolate.</h2>
      <p class="section-lead">
        The same origin-to-taste journey, shaped around a beverage or explored on its own.
      </p>
    </header>

    <div class="experience-grid">
      @for (experience of experiences; track experience.name) {
        <experience-card [experience]="experience" />
      }
    </div>
  </div>
</section>
