name: Deploy Azoth Chocolate to Namecheap via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build Angular site
        run: npm run build -- --configuration production

      - name: Verify build
        run: test -f dist/cloudflare/browser/index.html

      - name: Deploy site via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || secrets.NAMECHEAP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.NAMECHEAP_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.NAMECHEAP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/cloudflare/browser/
          server-dir: ./public_html/
          log-level: minimal
