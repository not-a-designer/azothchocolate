name: Deploy to Namecheap via FTP

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch uses the old naming

jobs:
  web-deploy:
    name: 🎉 Deploy Website
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    # OPTIONAL: If your project needs a build step (like React, Vue, or Tailwind), 
    # uncomment the lines below to build your project first.
    # - name: Install Node.js & Build
    #   run: |
    #     npm install
    #     npm run build

    - name: 🚀 Upload files via FTP
      uses: not-a-designer/FTP-Deploy-Action
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # server-dir: ./public_html/ # Uncomment and change if you need to upload to a specific subfolder