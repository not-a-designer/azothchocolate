name: Deploy Azoth Chocolate to Namecheap via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer update --working-dir=backend --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Validate PHP source
        run: php -l backend/api/contact.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build Angular site
        run: npm run build -- --configuration production

      - name: Stage PHP endpoint and live smoke test
        run: |
          mkdir -p dist/cloudflare/browser/api dist/cloudflare/browser/vendor
          cp backend/api/contact.php dist/cloudflare/browser/api/contact.php
          cp -R backend/vendor/. dist/cloudflare/browser/vendor/
          cp backend/vendor-protection.htaccess dist/cloudflare/browser/vendor/.htaccess
          cp backend/contact-smoke-test.html dist/cloudflare/browser/contact-smoke-test.html

      - name: Verify build
        run: |
          test -f dist/cloudflare/browser/index.html
          test -f dist/cloudflare/browser/api/contact.php
          test -f dist/cloudflare/browser/vendor/autoload.php
          test -f dist/cloudflare/browser/vendor/.htaccess
          test -f dist/cloudflare/browser/contact-smoke-test.html

      - name: Deploy site via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || secrets.NAMECHEAP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.NAMECHEAP_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.NAMECHEAP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/cloudflare/browser/
          server-dir: ./
          log-level: minimal
