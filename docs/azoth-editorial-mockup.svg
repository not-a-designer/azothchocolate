<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
  <title id="title">Azoth Chocolate editorial homepage direction</title>
  <desc id="desc">A compact visual mockup showing a direct hero, host benefits, grouped tasting formats, and a simple call to action.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9b18b"/>
      <stop offset="1" stop-color="#6b3429"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c58d62"/>
      <stop offset="0.55" stop-color="#84513e"/>
      <stop offset="1" stop-color="#35140f"/>
    </linearGradient>
    <style>
      .display { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; letter-spacing: -2px; }
      .body { font-family: Arial, sans-serif; }
      .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .small { font-family: Arial, sans-serif; font-size: 15px; }
    </style>
  </defs>

  <rect width="1440" height="1180" fill="#f2ebdd"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="88" fill="#fbf6ed"/>
  <text x="76" y="52" class="display" font-size="26" fill="#35140f" letter-spacing="4">AZOTH</text>
  <text x="252" y="49" class="label" fill="#35140f">WHAT WE OFFER</text>
  <text x="420" y="49" class="label" fill="#35140f">FOR HOSTS</text>
  <text x="540" y="49" class="label" fill="#35140f">ABOUT</text>
  <rect x="1198" y="23" width="166" height="42" fill="#35140f"/>
  <text x="1281" y="49" text-anchor="middle" class="label" fill="#fbf6ed">PLAN A TASTING</text>

  <!-- Hero -->
  <rect x="0" y="88" width="1440" height="442" fill="#fbf6ed"/>
  <rect x="820" y="122" width="500" height="360" fill="url(#hero)"/>
  <circle cx="1010" cy="254" r="65" fill="#3d1d15" opacity=".75"/>
  <circle cx="1145" cy="330" r="90" fill="#241a16" opacity=".72"/>
  <rect x="940" y="385" width="250" height="38" rx="19" fill="#f2ebdd" opacity=".62"/>
  <text x="120" y="158" class="label" fill="#7c3045">CHOCOLATE EXPERIENCES FOR VENUES</text>
  <text x="120" y="248" class="display" font-size="72" fill="#35140f">Give people a better</text>
  <text x="120" y="326" class="display" font-size="72" fill="#35140f">reason to gather.</text>
  <text x="120" y="366" class="small" font-size="18" fill="#35140f">Azoth brings guided tastings of fine chocolate to breweries,</text>
  <text x="120" y="393" class="small" font-size="18" fill="#35140f">wineries, coffee roasters, and other places people already gather.</text>
  <rect x="120" y="427" width="157" height="42" fill="#35140f"/>
  <text x="198" y="453" text-anchor="middle" class="label" fill="#fbf6ed">PLAN A TASTING</text>
  <text x="311" y="453" class="label" fill="#35140f">SEE THE FORMATS  →</text>
  <text x="120" y="500" class="small" fill="#7c3045">Chocolate, the universal solvent.</text>

  <!-- Host value -->
  <rect x="0" y="530" width="1440" height="170" fill="#35140f"/>
  <text x="120" y="578" class="label" fill="#d49a35">WHAT AZOTH BRINGS</text>
  <text x="120" y="625" class="display" font-size="43" fill="#fbf6ed">A clear format. Better conversation.</text>
  <line x1="745" y1="560" x2="745" y2="675" stroke="#f2ebdd" stroke-opacity=".28"/>
  <text x="790" y="579" class="label" fill="#d49a35">FOR THE HOST</text>
  <text x="790" y="618" class="small" fill="#f2ebdd">Azoth brings the chocolate and leads the tasting.</text>
  <text x="790" y="645" class="small" fill="#f2ebdd">You bring the place, the people, and what you pour.</text>

  <!-- Formats -->
  <rect x="0" y="700" width="1440" height="345" fill="#f2ebdd"/>
  <text x="120" y="748" class="label" fill="#7c3045">CHOOSE THE FORMAT</text>
  <text x="120" y="797" class="display" font-size="48" fill="#35140f">Pair with what you pour—or keep it all chocolate.</text>
  <text x="120" y="827" class="small" fill="#35140f">Four focused programs, one host-led tasting experience.</text>

  <g transform="translate(120 865)">
    <rect width="274" height="135" fill="#a4513e"/>
    <rect width="274" height="5" fill="#fbf6ed"/>
    <text x="22" y="38" class="label" fill="#fbf6ed">CACAO &amp; CUP</text>
    <text x="22" y="67" class="small" fill="#fbf6ed">Chocolate + specialty coffee</text>
    <text x="22" y="104" class="small" fill="#fbf6ed" opacity=".8">Origin · roast · aroma</text>
  </g>
  <g transform="translate(410 865)">
    <rect width="274" height="135" fill="#d49a35"/>
    <rect width="274" height="5" fill="#35140f"/>
    <text x="22" y="38" class="label" fill="#35140f">CACAO &amp; CRAFT</text>
    <text x="22" y="67" class="small" fill="#35140f">Chocolate + craft beer</text>
    <text x="22" y="104" class="small" fill="#35140f" opacity=".78">Malt · bitterness · aroma</text>
  </g>
  <g transform="translate(700 865)">
    <rect width="274" height="135" fill="#7c3045"/>
    <rect width="274" height="5" fill="#fbf6ed"/>
    <text x="22" y="38" class="label" fill="#fbf6ed">CACAO &amp; VINE</text>
    <text x="22" y="67" class="small" fill="#fbf6ed">Chocolate + wine</text>
    <text x="22" y="104" class="small" fill="#fbf6ed" opacity=".8">Fruit · tannin · acidity</text>
  </g>
  <g transform="translate(990 865)">
    <rect width="274" height="135" fill="#5f6338"/>
    <rect width="274" height="5" fill="#fbf6ed"/>
    <text x="22" y="38" class="label" fill="#fbf6ed">CACAO &amp; COCOA</text>
    <text x="22" y="67" class="small" fill="#fbf6ed">Four chocolates, no pairing</text>
    <text x="22" y="104" class="small" fill="#fbf6ed" opacity=".8">History · craft · flavor</text>
  </g>

  <!-- Close -->
  <rect x="0" y="1045" width="1440" height="135" fill="#262321"/>
  <text x="120" y="1092" class="label" fill="#d49a35">ONE LAST THING</text>
  <text x="120" y="1135" class="display" font-size="43" fill="#fbf6ed">Tell me what your guests should discover.</text>
  <rect x="1170" y="1092" width="170" height="42" fill="#fbf6ed"/>
  <text x="1255" y="1118" text-anchor="middle" class="label" fill="#35140f">JOEL@AZOTH</text>
</svg>
